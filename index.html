<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4CAF50" />

    <!-- SEO: Default meta tags (will be updated by React) -->
    <title>TableConv - CSV/JSON/Markdown/HTML/TeX Table Converter</title>
    <meta name="description" content="Free online tool to convert table data between CSV, JSON, Markdown, HTML, and TeX formats." />

    <!-- SEO: keywords -->
    <meta name="keywords" content="CSV,JSON,Markdown,HTML,TeX,table converter,data conversion,online tool,free" />

    <!-- SEO: robots -->
    <meta name="robots" content="index, follow" />

    <!-- SEO: canonical URL (will be updated by React) -->
    <link rel="canonical" href="https://table-conv.awef.me/" />

    <!-- hreflang tags for multilingual SEO (will be updated by React) -->
    <link rel="alternate" hreflang="ja" href="https://table-conv.awef.me/jp/" />
    <link rel="alternate" hreflang="en" href="https://table-conv.awef.me/en/" />
    <link rel="alternate" hreflang="zh-Hans" href="https://table-conv.awef.me/cn/" />
    <link rel="alternate" hreflang="x-default" href="https://table-conv.awef.me/" />

    <!-- OGP (Open Graph Protocol) for SNS sharing (will be updated by React) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TableConv - Table Converter" />
    <meta property="og:description" content="Convert table data between CSV, JSON, Markdown, HTML, and TeX." />
    <meta property="og:url" content="https://table-conv.awef.me/" />
    <meta property="og:site_name" content="TableConv" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:image" content="https://table-conv.awef.me/ogp-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card (will be updated by React) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TableConv - Table Converter" />
    <meta name="twitter:description" content="Free online tool to convert between CSV, JSON, Markdown, HTML, and TeX" />
    <meta name="twitter:image" content="https://table-conv.awef.me/ogp-image.png" />

    <!-- Structured data (JSON-LD) for Rich Snippets (will be updated by React) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "TableConv",
      "url": "https://table-conv.awef.me/",
      "description": "Free online tool to convert table data between CSV, JSON, Markdown, HTML, and TeX formats",
      "applicationCategory": "UtilitiesApplication",
      "operatingSystem": "Web Browser",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "CSV Conversion",
        "JSON Conversion",
        "Markdown Conversion",
        "HTML Conversion",
        "TeX/LaTeX Conversion",
        "File Upload",
        "Real-time Preview",
        "Cell Editing"
      ],
      "inLanguage": ["ja", "en", "zh-Hans"]
    }
    </script>

    <!-- Add Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <div id="root"></div>
